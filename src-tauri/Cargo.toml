[package]
name = "kiln"
version = "0.1.0"
edition = "2021"
description = "Open-source block-based terminal"
license = "MIT"

[lib]
name = "kiln_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
